<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oriel</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#131915;color:#ebeedf}body{min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(390px,calc(100vw - 36px));padding:32px;border:1px solid #465347;background:#202920;border-radius:14px;box-shadow:0 24px 60px #0008}h1{font-size:25px;margin:0 0 8px;color:#e9d7a6}p{color:#b8c2ae;line-height:1.5}input,button{width:100%;padding:11px;border-radius:6px;font:inherit}input{color:#fff;background:#111811;border:1px solid #65705d}button{margin-top:9px;background:#a57942;color:#fff;border:0;cursor:pointer}#msg{min-height:22px;font-size:13px}</style></head><body><main><h1>Oriel</h1><p>접근 코드를 입력하세요.</p><form id="f"><input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="접근 코드"><button>열기</button></form><p id="msg"></p></main><script>const f=document.getElementById('f'),input=document.getElementById('key'),msg=document.getElementById('msg');f.onsubmit=e=>{e.preventDefault();location.hash=encodeURIComponent(input.value.trim());openApp()};async function openApp(){let key=decodeURIComponent(location.hash.slice(1));if(!key)return;msg.textContent='여는 중…';try{let b=new Uint8Array(await(await fetch('payload.bin',{cache:'no-store'})).arrayBuffer());if(String.fromCharCode(...b.slice(0,4))!=='ORE1')throw Error('format');let salt=b.slice(4,20),iv=b.slice(20,32),body=b.slice(32);let raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),'PBKDF2',false,['deriveKey']);let aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},aes,body);let html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(e){msg.textContent='코드가 일치하지 않거나 파일을 열 수 없습니다.'}}window.addEventListener('hashchange',openApp);openApp();</script></body></html>
